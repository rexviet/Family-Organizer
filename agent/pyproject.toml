[project]
name = "family-agent"
version = "0.0.0"  # phiên bản phát hành thật lấy từ env AGENT_VERSION (CI truyền)
description = "Trợ lý AI agent cho Family Organizer (Pydantic AI + CodeMode)"
requires-python = ">=3.12,<3.13"
dependencies = [
  # Pin CHÍNH XÁC theo spike phase 1 (plans/261010-1652-ai-agent/reports/spike-s1.md).
  "pydantic-ai-slim[openai]==2.33.0",
  "pydantic-ai-harness[codemode]==0.25.0",
  # harness 0.25.0 khai pydantic-monty>=0.0.19 không chặn trên; 1.1.0 đổi tên key resource_limits
  # → mọi run_code lỗi. Bắt buộc pin.
  "pydantic-monty==0.0.21",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic-settings>=2.4",
  "httpx>=0.28",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/family_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["spike"]  # spike phase 1 là mã thử nghiệm đã chốt, không lint

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]  # assert + secret giả trong test

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
