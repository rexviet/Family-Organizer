name: Release

# Tạo tag vX.Y.Z → build 2 image arm64 cho Pi 5 (app + agent, cùng tag) → đẩy lên GHCR → tạo GitHub Release
# với ghi chú lấy từ CHANGELOG.md. App trên Pi thấy bản mới trong
# Thiết lập → Hệ thống & Sao lưu → Phiên bản & Cập nhật.
#   npm run release -- 1.1.0     (xem scripts/release.sh)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    # Runner ARM64 native (miễn phí cho repo public): build thẳng cho Pi 5,
    # không cần giả lập QEMU — nhanh hơn và tránh lỗi "Illegal instruction"
    # khi npm/V8 (Node 22) chạy dưới QEMU.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Phiên bản
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG" ]; then echo "::error::Tag v$VERSION khác version package.json ($PKG)"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$VERSION" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # GHCR bắt buộc chữ thường; owner lấy từ repo để fork cũng phát hành được.
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/$OWNER/family-organizer" >> "$GITHUB_OUTPUT"
          echo "agent_image=ghcr.io/$OWNER/family-organizer-agent" >> "$GITHUB_OUTPUT"

      - name: Ghi chú phát hành từ CHANGELOG.md
        run: |
          # So khớp chuỗi (index), không dùng regex: "[" và "." trong regex awk dễ khớp nhầm mục khác.
          awk -v v="${{ steps.v.outputs.version }}" '
            index($0, "## [" v "]") == 1 || index($0, "## " v " ") == 1 {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "Cập nhật v${{ steps.v.outputs.version }}" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image agent cùng tag với app, build TRƯỚC: agent lỗi build thì chưa có tag app nào
      # được đẩy (app trên Pi không thấy bản mới thiếu agent). Dịch vụ cập nhật đổi
      # FAMILY_ORGANIZER_AGENT_VERSION sang tag này (chỉ với bản ≥ 1.2.0).
      - name: Build & push agent (arm64)
        uses: docker/build-push-action@v6
        with:
          context: agent
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.v.outputs.agent_image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.agent_image }}:${{ steps.v.outputs.minor }}
            ${{ steps.v.outputs.agent_image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
          build-args: |
            AGENT_VERSION=${{ steps.v.outputs.version }}

      - name: Build & push (Raspberry Pi 5 = arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.minor }}
            ${{ steps.v.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.v.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.v.outputs.time }}

      # Pi kéo image KHÔNG đăng nhập. Package GHCR mới tạo mặc định là private → lần phát
      # hành đầu có image agent: vào GitHub → Packages → family-organizer-agent → Package
      # settings → Change visibility → Public, rồi chạy lại job này. Chặn ở đây để không tạo
      # Release (app không báo bản mới) khi Pi chưa kéo được image.
      - name: Kiểm image kéo được không cần đăng nhập
        run: |
          docker logout ghcr.io
          for img in "${{ steps.v.outputs.image }}" "${{ steps.v.outputs.agent_image }}"; do
            docker manifest inspect "$img:${{ steps.v.outputs.version }}" >/dev/null \
              || { echo "::error::$img:${{ steps.v.outputs.version }} chưa public — đổi package sang Public rồi chạy lại"; exit 1; }
          done

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.v.outputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(steps.v.outputs.version, '-') }}
