# Family Organizer — bản cài riêng (một stack chỉ có app này).
# Cài chung stack homelab thì xem repo liu-homelab (cùng cơ chế cập nhật).
#
# .env cạnh file này cần có:
#   STACK_DIR=<đường dẫn tuyệt đối tới thư mục này>   (vd /root/Family-Organizer)
#   FAMILY_ORGANIZER_VERSION=<phiên bản>              (vd 1.0.0 — để trống = latest)
# Trợ lý nâng cao (tùy chọn, từ v1.2.0): thêm COMPOSE_PROFILES=agent + AGENT_SHARED_SECRET
# + 3 biến AGENT_LLM_* (xem .env.example và README mục "Trợ lý nâng cao").
# Sau đó mọi cập nhật làm trong app: Thiết lập → Hệ thống & Sao lưu → Phiên bản & Cập nhật.

services:
  family-organizer:
    # Image do CI build mỗi bản phát hành (.github/workflows/release.yml), tag = số phiên bản.
    # Dịch vụ cập nhật đổi FAMILY_ORGANIZER_VERSION trong .env rồi kéo bản mới.
    # `build:` để vẫn build tay được: docker compose up -d --build
    image: ghcr.io/happysmartlight/family-organizer:${FAMILY_ORGANIZER_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
        APP_VERSION: ${APP_VERSION:-}
        BUILD_TIME: ${BUILD_TIME:-}
    container_name: family_organizer_app
    restart: unless-stopped
    ports:
      # Bind only to loopback + LAN IP (NOT 0.0.0.0) so the Tailscale interface
      # stays free for `tailscale serve` to expose HTTPS on the same port 3001.
      # This matches the rest of the homelab (immich/homepage/etc).
      # LAN_IP = IP LAN của máy chạy (mặc định IP của Pi). Chạy thử trên máy
      # khác thì đặt LAN_IP trong .env, nếu không Docker báo "can't assign requested address".
      - "127.0.0.1:3001:3000"
      - "${LAN_IP:-192.168.1.2}:3001:3000"
    volumes:
      # Persistent storage on Raspberry Pi 5.
      # DB file + uploaded images (avatars/assets/receipts) + daily backups.
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Asia/Ho_Chi_Minh
      # Compose auto-reads ./.env for ${VAR} substitution; ":-" => empty if missing
      # (gitignored, never baked into the image). Used by the AI assistant.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_URL=${APP_URL:-}
      # Web Push (VAPID) — thông báo đẩy PWA (banner + badge). Đặt 3 biến này
      # trong ./.env trên Pi; để trống thì tính năng tự tắt, app vẫn chạy.
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      # Repo GitHub để app đọc danh sách bản phát hành.
      - GITHUB_REPO=${GITHUB_REPO:-happysmartlight/Family-Organizer}
      # Trợ lý nâng cao (container family-organizer-agent). Secret trống = tắt, app
      # dùng trợ lý cũ. Agent không chạy/không tới được → app cũng tự lùi về trợ lý cũ.
      - AGENT_URL=${AGENT_URL:-http://family-organizer-agent:3100}
      - AGENT_SHARED_SECRET=${AGENT_SHARED_SECRET:-}
    networks:
      - default
      - fo-agent
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Trợ lý nâng cao (Python, Pydantic AI). CHỈ chạy khi bật profile: COMPOSE_PROFILES=agent
  # trong .env — tránh container thiếu secret khởi động lỗi lặp lại ở bản cài chưa dùng agent.
  # Không publish port, không mount data/, không docker socket: chỉ app gọi được, và agent
  # chỉ đọc dữ liệu qua API của app bằng token ngắn hạn. Agent chỉ ĐỀ XUẤT, app mới ghi.
  family-organizer-agent:
    # Biến phiên bản RIÊNG: dịch vụ cập nhật chỉ đổi biến này khi bản đích có image agent
    # (≥ 1.2.0) → "Quay về" bản cũ không làm compose trỏ tới tag agent không tồn tại.
    image: ghcr.io/happysmartlight/family-organizer-agent:${FAMILY_ORGANIZER_AGENT_VERSION:-latest}
    build:
      context: ./agent
      args:
        AGENT_VERSION: ${APP_VERSION:-dev}
    profiles: ["agent"]
    container_name: family_organizer_agent
    restart: unless-stopped
    environment:
      - AGENT_SHARED_SECRET=${AGENT_SHARED_SECRET:-}
      - AGENT_LLM_BASE_URL=${AGENT_LLM_BASE_URL:-}
      - AGENT_LLM_API_KEY=${AGENT_LLM_API_KEY:-}
      - AGENT_LLM_MODEL=${AGENT_LLM_MODEL:-}
      - APP_INTERNAL_URL=http://family-organizer:3000
      - TZ=Asia/Ho_Chi_Minh
    # Đo trên arm64 (spike phase 1): đỉnh 101–123 MiB. 384m chừa chỗ cho Pi (trang 16 KiB).
    mem_limit: 384m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      # fo-agent: mạng nội bộ chỉ app + agent (service khác trong stack không gọi được agent).
      # fo-egress: để agent ra Internet tới endpoint LLM.
      - fo-agent
      - fo-egress
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Nút "Cập nhật" trong app. Container này cầm docker socket (quyền ngang root)
  # nên KHÔNG mở cổng mạng nào: chỉ đọc file yêu cầu trong data/update/ và chỉ
  # đụng tới service family-organizer (và family-organizer-agent nếu có). Script tự tải lần đầu, sau đó tự thay
  # bằng bản đi kèm mỗi phiên bản mới.
  family-organizer-updater:
    image: docker:28-cli
    container_name: family-organizer-updater
    restart: unless-stopped
    init: true
    entrypoint:
      - /bin/sh
      - -c
      - |
        f="$$STACK_DIR/updater/updater.sh"
        if [ ! -s "$$f" ]; then
          mkdir -p "$$STACK_DIR/updater"
          wget -qO "$$f.tmp" https://raw.githubusercontent.com/happysmartlight/Family-Organizer/main/deploy/updater.sh && mv "$$f.tmp" "$$f"
        fi
        exec /bin/sh "$$f"
    environment:
      STACK_DIR: ${STACK_DIR:?Chưa đặt STACK_DIR trong .env (đường dẫn tuyệt đối tới thư mục chứa docker-compose.yml)}
      APP_DATA: ${STACK_DIR}/data
      SERVICE: family-organizer
      VERSION_VAR: FAMILY_ORGANIZER_VERSION
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Đúng đường dẫn như trên host: docker compose gửi đường dẫn bind mount
      # thẳng cho Docker daemon, daemon hiểu theo hệ thống file của host.
      - ${STACK_DIR}:${STACK_DIR}
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "2"

networks:
  fo-agent:
    internal: true
  fo-egress: {}
